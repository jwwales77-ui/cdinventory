<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0B4A2B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WM Inventory">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>WM Weekly Inventory</title>
<style>
  :root{
    --ink:#16211B;
    --paper:#F4F6F2;
    --card:#FFFFFF;
    --green:#00703C;
    --green-dark:#0B4A2B;
    --amber:#F2A900;
    --amber-dark:#8A6100;
    --red:#C0392B;
    --steel:#C9CFC9;
    --muted:#5B6660;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--paper);color:var(--ink);
    font-size:16px;line-height:1.35;padding-bottom:96px;
  }
  button{font-family:inherit;border:none;cursor:pointer}
  input,select,textarea{font-family:inherit}

  header{
    background:var(--green-dark);color:#fff;padding:14px 16px 12px;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  header h1{font-size:19px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
  header h1 span{color:var(--amber)}
  .sub{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9FC4AE;margin-top:2px}
  .meta-row{display:flex;gap:10px;margin-top:10px}
  .meta-row label{
    flex:1;display:flex;flex-direction:column;gap:2px;
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#BBD4C4;
  }
  .meta-row input{
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:6px;
    color:#fff;font-size:15px;font-weight:600;padding:7px 9px;width:100%;
  }
  .meta-row input:focus{outline:2px solid var(--amber);outline-offset:1px}

  nav{display:flex;background:var(--card);border-bottom:2px solid var(--steel);position:sticky;top:0;z-index:15}
  nav button{
    flex:1;padding:12px 4px;background:none;font-size:13px;font-weight:800;
    text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    border-bottom:4px solid transparent;
  }
  nav button.active{color:var(--green-dark);border-bottom-color:var(--amber)}

  main{padding:12px 12px 8px;max-width:560px;margin:0 auto}
  .view{display:none}
  .view.active{display:block}

  section.card{
    background:var(--card);border:1px solid var(--steel);border-radius:12px;
    margin-bottom:16px;
    --sec-color:var(--green);
  }
  .sec-head{
    background:var(--sec-color);color:#fff;padding:10px 14px;
    font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;
    position:sticky;top:var(--navH,46px);z-index:10;
    border-radius:11px 11px 0 0;
  }
  .sec-head.scrap{background:var(--ink)}

  .size-row{
    border-top:1px solid #E3E8E2;padding:10px 12px 12px;
    border-left:5px solid var(--sec-color);
  }
  .size-row:nth-child(even){background:#EFF4EE}
  .size-row:last-child{border-radius:0 0 11px 11px}
  .size-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .placard{
    display:inline-block;background:var(--ink);color:#fff;font-weight:900;font-size:16px;
    letter-spacing:.04em;padding:5px 12px;border-radius:4px;border-left:5px solid var(--amber);
    text-transform:uppercase;
  }
  .note-btn{
    background:none;color:var(--muted);font-size:12px;font-weight:700;
    text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-radius:6px;
  }
  .note-btn.has-note{color:var(--green-dark)}
  .counters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .counter{border-radius:10px;overflow:hidden;border:2px solid transparent;display:flex;flex-direction:column}
  .counter.ready{border-color:var(--green)}
  .counter.repair{border-color:var(--amber-dark)}
  .count-tap{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:12px 4px 10px;min-height:80px;color:#fff;user-select:none;
  }
  .counter.ready .count-tap{background:var(--green)}
  .counter.repair .count-tap{background:var(--amber);color:var(--ink)}
  .count-tap:active{filter:brightness(1.15)}
  .count-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.9}
  .count-num{font-size:34px;font-weight:900;line-height:1.05}
  .count-minus{background:#fff;color:var(--muted);font-size:22px;font-weight:900;padding:8px 0}
  .count-minus:active{background:#E6EAE5}
  .note-field{margin-top:8px}
  .note-field textarea{
    width:100%;border:1px solid var(--steel);border-radius:8px;padding:8px 10px;
    font-size:14px;min-height:52px;resize:vertical;
  }
  .note-field textarea:focus{outline:2px solid var(--green)}
  .hidden{display:none !important}

  /* Scrap */
  .scrap-form{padding:12px;display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:center}
  .scrap-form select,.scrap-form input{
    width:100%;padding:11px 9px;border:1px solid var(--steel);border-radius:8px;
    font-size:15px;font-weight:600;background:#fff;
  }
  .scrap-form input{text-align:center;font-size:18px;font-weight:900}
  .scrap-form .full{grid-column:1 / -1}
  .scrap-add{
    grid-column:1 / -1;background:var(--ink);color:#fff;padding:13px;border-radius:8px;
    font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;
  }
  .scrap-add:active{filter:brightness(1.3)}
  .scrap-item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:11px 12px;border-top:1px solid #E3E8E2;font-size:15px;
  }
  .scrap-item:nth-child(even){background:#F7F8F6}
  .scrap-item b{font-weight:900}
  .scrap-item .rm{background:none;color:var(--red);font-size:12px;font-weight:800;text-transform:uppercase;padding:6px}
  .scrap-empty{padding:16px 12px;color:var(--muted);font-size:14px;text-align:center;border-top:1px solid #E3E8E2}

  .action-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:8px;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--card);border-top:2px solid var(--steel);max-width:560px;margin:0 auto;
  }
  .action-bar button{
    flex:1;padding:14px 6px;border-radius:10px;font-size:14px;font-weight:900;
    text-transform:uppercase;letter-spacing:.05em;
  }
  #undoBtn{
    background:#E6EAE5;color:var(--ink);flex:0 0 96px;
    position:relative;overflow:hidden;isolation:isolate;
  }
  #undoBtn:disabled{opacity:.4}
  #undoBtn .lbl{position:relative;z-index:2}
  #undoFill{
    position:absolute;left:0;top:0;bottom:0;width:0%;
    background:var(--red);z-index:1;pointer-events:none;
  }
  #undoBtn.holding .lbl{color:#fff}
  #saveWeekBtn{background:#E6EAE5;color:var(--ink)}
  #sendBtn{background:var(--amber);color:var(--ink);flex:1.3}
  .action-bar button:active{filter:brightness(1.1)}

  #toast{
    position:fixed;bottom:92px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;
    font-size:14px;font-weight:700;opacity:0;pointer-events:none;
    transition:opacity .25s,transform .25s;z-index:40;max-width:90%;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* Send sheet */
  #sendSheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
  #sendSheet.open{display:flex}
  .sheet{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:560px;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
  .sheet h2{font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
  .sheet .to{font-size:12px;color:var(--muted);margin-bottom:12px}
  .sheet button{display:block;width:100%;padding:15px;border-radius:10px;margin-bottom:10px;font-size:15px;font-weight:800;text-align:left}
  .sheet small{display:block;font-weight:400;font-size:12px;opacity:.85;margin-top:2px}
  .opt-email{background:var(--green);color:#fff}
  .opt-pdf{background:var(--green-dark);color:#fff}
  .opt-csv{background:#E6EAE5;color:var(--ink)}
  .opt-cancel{background:none;color:var(--muted);text-align:center;font-weight:700}

  /* Send animation overlay */
  #sendAnim{
    position:fixed;inset:0;z-index:70;display:none;
    background:linear-gradient(#8FA5B3 0%,#B8C6CF 55%,#6E6E6E 55%,#5E5E5E 100%);
    flex-direction:column;align-items:center;justify-content:center;
  }
  #sendAnim.open{display:flex}
  #sendAnim svg{width:100%;max-width:520px;height:auto}
  .anim-caption{
    margin-top:18px;color:#fff;font-size:17px;font-weight:900;text-transform:uppercase;
    letter-spacing:.12em;opacity:0;transition:opacity .4s;text-shadow:0 2px 6px rgba(0,0,0,.5);
  }
  .anim-caption.show{opacity:1}

  /* History */
  .week-card{background:var(--card);border:1px solid var(--steel);border-radius:12px;margin-bottom:12px;padding:12px 14px}
  .week-card h3{font-size:15px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .week-card h3 .del{background:none;color:var(--red);font-size:12px;font-weight:800;text-transform:uppercase;padding:4px 6px}
  .sent-badge{
    display:inline-block;background:var(--green);color:#fff;font-size:10px;font-weight:900;
    text-transform:uppercase;letter-spacing:.07em;padding:3px 7px;border-radius:4px;margin-left:6px;vertical-align:middle;
  }
  .sent-badge.no{background:#D8DDD8;color:var(--muted)}
  .week-card table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
  .week-card th,.week-card td{padding:5px 6px;text-align:center;border-bottom:1px solid #EDF1EC}
  .week-card th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .week-card td:first-child,.week-card th:first-child{text-align:left;font-weight:700}
  .sec-band td{background:#E8EEE7 !important;font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.06em;text-align:left !important}
  .empty-msg{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px}

  #printReport{display:none}
  @media print{
    body{padding:0;background:#fff}
    body > *:not(#printReport){display:none !important}
    #printReport{display:block;font-size:12px;color:#000}
    #printReport h1{font-size:20px;margin-bottom:2px}
    #printReport .pr-meta{margin-bottom:12px;font-size:13px}
    #printReport h2{font-size:14px;background:#1F3864;color:#fff;padding:6px 10px;margin-top:14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    #printReport table{width:100%;border-collapse:collapse}
    #printReport th,#printReport td{border:1px solid #8496B0;padding:6px 8px;text-align:center}
    #printReport th{background:#DCE6F1;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    #printReport td:first-child,#printReport th:first-child{text-align:left;font-weight:700}
    #printReport tr:nth-child(even) td{background:#EFF3F9;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    #printReport .callout{border:2px solid #1F3864;padding:8px 10px;margin-bottom:12px}
    #printReport .callout b{display:block;margin-bottom:4px;font-size:13px}
    #printReport .callout ul{margin:0 0 0 18px}
  }
  @media (prefers-reduced-motion: reduce){
    #sendAnim *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>

<header>
  <h1>WM <span>Weekly Inventory</span></h1>
  <div class="sub">Jackson, TN &nbsp;&bull;&nbsp; v2.3</div>
  <div class="meta-row">
    <label>Date <input type="date" id="dateInput"></label>
    <label>Completed By <input type="text" id="nameInput" placeholder="Your name" autocomplete="name"></label>
  </div>
</header>

<nav>
  <button id="tabTally" class="active">Tally</button>
  <button id="tabHistory">History</button>
</nav>

<main>
  <div id="tallyView" class="view active"></div>
  <div id="historyView" class="view"></div>
</main>

<div class="action-bar">
  <button id="undoBtn" disabled><span id="undoFill"></span><span class="lbl">Undo</span></button>
  <button id="saveWeekBtn">Save Week</button>
  <button id="sendBtn">Send Report</button>
</div>

<div id="toast"></div>

<div id="sendSheet">
  <div class="sheet">
    <h2>Send Report</h2>
    <div class="to">To: Matt Rosenthal &amp; Jonathon Wales</div>
    <button class="opt-email" id="optEmail">Open in Email<small>Pre-filled &mdash; just tap Send</small></button>
    <button class="opt-pdf" id="optPdf">Save as PDF<small>Print view &mdash; choose "Save as PDF"</small></button>
    <button class="opt-csv" id="optCsv">Download CSV<small>Spreadsheet of this week's counts</small></button>
    <button class="opt-cancel" id="optCancel">Cancel</button>
  </div>
</div>

<div id="sendAnim">
  <svg id="truckSvg" viewBox="0 0 520 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <!-- ground -->
    <rect x="0" y="176" width="520" height="44" fill="#5A5A5A"/>
    <rect x="0" y="176" width="520" height="3" fill="#4A4A4A"/>

    <!-- Container (front-load dumpster), tilts up onto forks -->
    <g id="can" transform="translate(96,0)">
      <g id="canTilt">
        <!-- body: tapered dumpster, origin near bottom-left for tilt pivot -->
        <path d="M0,176 L4,126 L86,126 L90,176 Z" fill="#1E7A48"/>
        <path d="M4,126 L86,126 L82,134 L8,134 Z" fill="#2A9159"/>
        <rect x="10" y="142" width="70" height="4" fill="#175E38" opacity=".7"/>
        <!-- lid -->
        <path d="M2,126 L88,126 L86,119 L4,119 Z" fill="#333"/>
        <!-- fork pockets on the side, midway up -->
        <rect x="6" y="146" width="78" height="9" fill="#124B2C"/>
      </g>
    </g>

    <!-- Truck: cab + forks on rear. Drawn facing LEFT so it backs toward the can. -->
    <g id="truck" transform="translate(560,0)">
      <!-- fork arms extending left from truck rear -->
      <g id="forks">
        <rect x="-46" y="148" width="60" height="7" rx="2" fill="#2C2C2C"/>
        <rect x="-46" y="148" width="10" height="7" rx="2" fill="#3D3D3D"/>
        <rect x="8" y="120" width="9" height="42" fill="#2C2C2C"/>
      </g>
      <!-- frame -->
      <rect x="14" y="140" width="120" height="14" fill="#3A3A3A"/>
      <!-- toolbox -->
      <rect x="30" y="126" width="42" height="16" rx="2" fill="#C9CDD1"/>
      <rect x="30" y="126" width="42" height="4" rx="2" fill="#DFE3E6"/>
      <!-- cab -->
      <path d="M78,140 L78,84 Q78,78 84,78 L138,78 Q144,78 146,84 L152,112 L154,140 Z" fill="#FBFBF9"/>
      <!-- windshield / window -->
      <path d="M86,86 L134,86 L140,110 L86,110 Z" fill="#9FB6C4"/>
      <path d="M86,86 L104,86 L104,110 L86,110 Z" fill="#8AA5B5"/>
      <!-- WM logo block on door -->
      <rect x="88" y="116" width="14" height="7" fill="#00703C"/>
      <rect x="104" y="116" width="10" height="7" fill="#F2A900"/>
      <!-- truck number -->
      <text x="120" y="123" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#2B2B2B">633805</text>
      <!-- bumper + grille -->
      <rect x="146" y="126" width="10" height="18" fill="#B8BCC0"/>
      <rect x="148" y="146" width="10" height="7" rx="2" fill="#C9CDD1"/>
      <!-- mirror -->
      <rect x="74" y="86" width="4" height="14" fill="#B8BCC0"/>
      <!-- wheels -->
      <g id="wheelRear">
        <circle cx="42" cy="160" r="17" fill="#1C1C1C"/>
        <circle cx="42" cy="160" r="7.5" fill="#D8D8D4"/>
        <rect x="41" y="150" width="2" height="20" fill="#9A9A96"/>
        <rect x="32" y="159" width="20" height="2" fill="#9A9A96"/>
      </g>
      <g id="wheelFront">
        <circle cx="126" cy="160" r="17" fill="#1C1C1C"/>
        <circle cx="126" cy="160" r="7.5" fill="#D8D8D4"/>
        <rect x="125" y="150" width="2" height="20" fill="#9A9A96"/>
        <rect x="116" y="159" width="20" height="2" fill="#9A9A96"/>
      </g>
    </g>

    <!-- check mark badge -->
    <g id="checkBadge" opacity="0" transform="translate(260,96)">
      <circle cx="0" cy="0" r="40" fill="#00703C"/>
      <path id="checkPath" d="M-18,2 L-6,15 L19,-13" fill="none" stroke="#fff" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60"/>
    </g>
  </svg>
  <div class="anim-caption" id="animCaption">Report Ready</div>
</div>

<div id="printReport"></div>

<script>
"use strict";

// ---------------- Config ----------------
const RECIPIENTS = "mrosent2@wm.com,jwwales77@gmail.com";
const DRIVER = "";
const SITE = "Jackson, TN";
const SECTIONS = [
  { key:"frontload", name:"Front-Load Containers", short:"Front-Load", color:"#00703C", sizes:["2 yd","4 yd","6 yd","8 yd"] },
  { key:"rolloff",   name:"Open-Top Roll-Off Boxes", short:"Open-Top", color:"#1F3864", sizes:["<20 yd","20 yd","30 yd","40 yd"] },
  { key:"compactor", name:"Compactors", short:"Compactor", color:"#7A2E2E", sizes:["20 yd","30 yd","40 yd"] },
];
const FIELDS = ["ready","repair"];
const STORE_KEY = "wm_inv_v2";

// ---------------- Storage ----------------
function loadState(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }
  catch(e){ console.warn("Storage unavailable", e); }
  return null;
}
function persist(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

function blankCounts(){
  const c = {};
  for(const s of SECTIONS){
    c[s.key] = {};
    for(const size of s.sizes) c[s.key][size] = { ready:0, repair:0 };
  }
  return c;
}
function todayISO(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fmtDate(iso){ if(!iso) return ""; const p=iso.split("-"); return p[1]+"/"+p[2]+"/"+p[0]; }

let state = loadState() || {
  counts: blankCounts(), notes:{}, scrap:[], name:"", date:todayISO(),
  history:[], scrollY:0
};
(function patch(){
  const fresh = blankCounts();
  for(const k in fresh){
    if(!state.counts[k]) state.counts[k]=fresh[k];
    else {
      for(const sz in fresh[k]) if(!state.counts[k][sz]) state.counts[k][sz]=fresh[k][sz];
      // drop sizes that are no longer offered
      for(const sz in state.counts[k]) if(!fresh[k][sz]){
        delete state.counts[k][sz];
        if(state.notes) delete state.notes[k+"|"+sz];
      }
    }
  }
  // drop scrap lines for retired sizes
  if(Array.isArray(state.scrap)){
    state.scrap = state.scrap.filter(it=>{
      const sec = SECTIONS.find(s=>s.key===it.type);
      return sec && sec.sizes.indexOf(it.size)!==-1;
    });
  }
  if(!Array.isArray(state.history)) state.history=[];
  if(!Array.isArray(state.scrap)) state.scrap=[];
  if(!state.notes) state.notes={};
  if(!state.date) state.date=todayISO();
})();

let undoStack = [];

// ---------------- Tally UI ----------------
const tallyView = document.getElementById("tallyView");
function cssSafe(s){ return String(s).replace(/[^a-z0-9]/gi,"_"); }
function cid(sec,size,f){ return cssSafe(sec+"_"+size+"_"+f); }

function buildTally(){
  tallyView.innerHTML = "";
  for(const sec of SECTIONS){
    const card = document.createElement("section");
    card.className = "card";
    card.style.setProperty("--sec-color", sec.color||"var(--green)");
    card.innerHTML = '<div class="sec-head">'+sec.name+'</div>';
    sec.sizes.forEach(size=>{
      const noteKey = sec.key+"|"+size;
      const c = state.counts[sec.key][size];
      const row = document.createElement("div");
      row.className = "size-row";
      row.innerHTML =
        '<div class="size-top"><span class="placard">'+size+'</span>'+
        '<button class="note-btn" data-note="'+noteKey+'">&#9998; Note</button></div>'+
        '<div class="counters">'+
        FIELDS.map(f=>
          '<div class="counter '+f+'">'+
            '<div class="count-tap" data-sec="'+sec.key+'" data-size="'+size+'" data-field="'+f+'">'+
              '<span class="count-label">'+f+'</span>'+
              '<span class="count-num" id="n_'+cid(sec.key,size,f)+'">'+c[f]+'</span>'+
            '</div>'+
            '<button class="count-minus" data-sec="'+sec.key+'" data-size="'+size+'" data-field="'+f+'" aria-label="minus">&minus;</button>'+
          '</div>').join("")+
        '</div>'+
        '<div class="note-field hidden" id="note_'+cssSafe(noteKey)+'">'+
          '<textarea placeholder="Note for '+size+'..." data-notekey="'+noteKey+'">'+(state.notes[noteKey]||"")+'</textarea>'+
        '</div>';
      card.appendChild(row);
    });
    tallyView.appendChild(card);
  }
  // Scrap card
  const scrapCard = document.createElement("section");
  scrapCard.className = "card";
  scrapCard.style.setProperty("--sec-color", "var(--ink)");
  scrapCard.innerHTML =
    '<div class="sec-head scrap">Scrap</div>'+
    '<div class="scrap-form">'+
      '<input type="number" id="scrapQty" min="1" step="1" value="1" inputmode="numeric">'+
      '<select id="scrapType"></select>'+
      '<select id="scrapSize" class="full"></select>'+
      '<button class="scrap-add" id="scrapAdd">Add Scrap</button>'+
    '</div>'+
    '<div id="scrapList"></div>';
  tallyView.appendChild(scrapCard);

  const typeSel = document.getElementById("scrapType");
  typeSel.innerHTML = SECTIONS.map(s=>'<option value="'+s.key+'">'+s.short+'</option>').join("");
  typeSel.addEventListener("change", fillScrapSizes);
  fillScrapSizes();
  document.getElementById("scrapAdd").addEventListener("click", addScrap);
  renderScrap();
  refreshNoteButtons();
}
function fillScrapSizes(){
  const key = document.getElementById("scrapType").value;
  const sec = SECTIONS.find(s=>s.key===key);
  document.getElementById("scrapSize").innerHTML = sec.sizes.map(z=>'<option>'+z+'</option>').join("");
}
function addScrap(){
  const qty = Math.max(1, parseInt(document.getElementById("scrapQty").value,10) || 1);
  const key = document.getElementById("scrapType").value;
  const size = document.getElementById("scrapSize").value;
  state.scrap.push({qty, type:key, size});
  document.getElementById("scrapQty").value = 1;
  persist(); renderScrap(); syncUndoBtn(); toast("Scrap added");
}
function scrapLabel(it){
  const sec = SECTIONS.find(s=>s.key===it.type);
  return it.qty + " \u00D7 " + (sec?sec.short:it.type) + " " + it.size;
}
function renderScrap(){
  const list = document.getElementById("scrapList");
  if(!list) return;
  if(!state.scrap.length){
    list.innerHTML = '<div class="scrap-empty">No scrap this week.</div>';
    return;
  }
  list.innerHTML = state.scrap.map((it,i)=>
    '<div class="scrap-item"><span><b>'+it.qty+'</b> &times; '+
    esc(SECTIONS.find(s=>s.key===it.type).short)+' '+esc(it.size)+
    '</span><button class="rm" data-rm="'+i+'">Remove</button></div>').join("");
}

tallyView.addEventListener("click",(e)=>{
  const tap = e.target.closest(".count-tap");
  if(tap){ change(tap.dataset.sec,tap.dataset.size,tap.dataset.field,+1); return; }
  const minus = e.target.closest(".count-minus");
  if(minus){ change(minus.dataset.sec,minus.dataset.size,minus.dataset.field,-1); return; }
  const nb = e.target.closest(".note-btn");
  if(nb){
    const box = document.getElementById("note_"+cssSafe(nb.dataset.note));
    box.classList.toggle("hidden");
    if(!box.classList.contains("hidden")) box.querySelector("textarea").focus();
    return;
  }
  const rm = e.target.closest("[data-rm]");
  if(rm){ state.scrap.splice(+rm.dataset.rm,1); persist(); renderScrap(); syncUndoBtn(); toast("Scrap removed"); }
});
tallyView.addEventListener("input",(e)=>{
  if(e.target.matches("textarea[data-notekey]")){
    state.notes[e.target.dataset.notekey]=e.target.value;
    refreshNoteButtons(); persist();
  }
});
function refreshNoteButtons(){
  document.querySelectorAll(".note-btn").forEach(b=>{
    const has = !!(state.notes[b.dataset.note]||"").trim();
    b.classList.toggle("has-note",has);
    b.innerHTML = has ? "&#9998; Note &#9679;" : "&#9998; Note";
  });
}
function change(sec,size,field,delta){
  const c = state.counts[sec][size];
  const next = c[field]+delta;
  if(next<0) return;
  c[field]=next;
  undoStack.push({sec,size,field,delta});
  if(undoStack.length>60) undoStack.shift();
  document.getElementById("n_"+cid(sec,size,field)).textContent = next;
  syncUndoBtn();
  persist();
}
function undo(){
  const last = undoStack.pop();
  if(!last) return;
  const c = state.counts[last.sec][last.size];
  c[last.field]=Math.max(0,c[last.field]-last.delta);
  document.getElementById("n_"+cid(last.sec,last.size,last.field)).textContent=c[last.field];
  syncUndoBtn();
  persist(); toast("Undone");
}
// Undo button: tap = undo last action, press-and-hold = reset everything
(function setupUndoButton(){
  const btn=document.getElementById("undoBtn");
  const fill=document.getElementById("undoFill");
  const HOLD_MS=1500;
  let timer=null, raf=null, held=false, startT=0;

  function startHold(){
    if(btn.disabled) return;
    if(totalCounted()===0) return;   // nothing to wipe
    held=false; startT=performance.now();
    btn.classList.add("holding");
    function step(now){
      const p=Math.min(1,(now-startT)/HOLD_MS);
      fill.style.width=(p*100)+"%";
      if(p<1) raf=requestAnimationFrame(step);
    }
    raf=requestAnimationFrame(step);
    timer=setTimeout(()=>{
      held=true;
      clearHold();
      if(navigator.vibrate) navigator.vibrate(40);
      if(confirm("Reset ALL counts, notes and scrap to zero?\n\nThis clears the current sheet. Saved weeks in History are not affected.")){
        resetSheet();
      }
    },HOLD_MS);
  }
  function clearHold(){
    clearTimeout(timer); cancelAnimationFrame(raf);
    btn.classList.remove("holding"); fill.style.width="0%";
  }
  function endHold(e){
    const wasHeld=held;
    clearHold();
    if(!wasHeld){
      if(e) e.preventDefault();
      undo();
    }
    held=false;
  }

  btn.addEventListener("pointerdown",(e)=>{ e.preventDefault(); startHold(); });
  btn.addEventListener("pointerup",endHold);
  btn.addEventListener("pointerleave",()=>{ if(!held) clearHold(); });
  btn.addEventListener("pointercancel",()=>{ clearHold(); held=false; });
  btn.addEventListener("contextmenu",(e)=>e.preventDefault());
})();

// Keep the button usable whenever there is anything to undo OR anything to clear
function syncUndoBtn(){
  const btn=document.getElementById("undoBtn");
  btn.disabled = (undoStack.length===0 && totalCounted()===0);
  btn.querySelector(".lbl").textContent = undoStack.length ? "Undo" : "Clear";
}

// ---------------- Header fields ----------------
const dateInput=document.getElementById("dateInput");
const nameInput=document.getElementById("nameInput");
dateInput.value=state.date; nameInput.value=state.name;
dateInput.addEventListener("change",()=>{state.date=dateInput.value;persist();});
nameInput.addEventListener("input",()=>{state.name=nameInput.value;persist();});

// ---------------- Scroll memory ----------------
let scrollTimer;
window.addEventListener("scroll",()=>{
  clearTimeout(scrollTimer);
  scrollTimer=setTimeout(()=>{
    if(document.getElementById("tallyView").classList.contains("active")){
      state.scrollY=window.scrollY; persist();
    }
  },250);
});

// ---------------- Tabs ----------------
const tabTally=document.getElementById("tabTally"), tabHistory=document.getElementById("tabHistory");
tabTally.addEventListener("click",()=>switchTab("tally"));
tabHistory.addEventListener("click",()=>switchTab("history"));
function switchTab(w){
  tabTally.classList.toggle("active",w==="tally");
  tabHistory.classList.toggle("active",w==="history");
  document.getElementById("tallyView").classList.toggle("active",w==="tally");
  document.getElementById("historyView").classList.toggle("active",w==="history");
  if(w==="history") buildHistory(); else window.scrollTo(0,state.scrollY||0);
}

// ---------------- Totals / guard ----------------
function totalCounted(){
  let t=0;
  for(const sec of SECTIONS) for(const size of sec.sizes){
    const c=state.counts[sec.key][size]; t+=c.ready+c.repair;
  }
  return t + state.scrap.reduce((a,b)=>a+b.qty,0);
}

// ---------------- Save week ----------------
document.getElementById("saveWeekBtn").addEventListener("click",()=>{
  if(totalCounted()===0){ toast("Nothing counted yet"); return; }
  saveSnapshot(false);
  toast("Week saved");
  setTimeout(()=>{
    if(confirm("Week saved to History.\n\nReset counts for a fresh sheet?")) resetSheet();
  },350);
});
function saveSnapshot(sent){
  const snap={
    savedAt:Date.now(), date:state.date||todayISO(), name:state.name,
    counts:JSON.parse(JSON.stringify(state.counts)),
    notes:JSON.parse(JSON.stringify(state.notes)),
    scrap:JSON.parse(JSON.stringify(state.scrap)),
    sent: !!sent
  };
  state.history.push(snap); persist();
  return snap;
}
function markLastSent(){
  if(state.history.length){ state.history[state.history.length-1].sent=true; persist(); }
}
function resetSheet(){
  state.counts=blankCounts(); state.notes={}; state.scrap=[];
  undoStack=[];
  state.date=todayISO(); dateInput.value=state.date; state.scrollY=0;
  persist(); buildTally(); syncUndoBtn(); window.scrollTo(0,0); toast("Counts reset");
}

// ---------------- History ----------------
function buildHistory(){
  const hv=document.getElementById("historyView");
  hv.innerHTML="";
  if(!state.history.length){
    hv.innerHTML='<div class="empty-msg">No saved weeks yet.<br>Tap <b>Save Week</b> or send a report to start the log.</div>';
    return;
  }
  for(let i=state.history.length-1;i>=0;i--){
    const snap=state.history[i];
    let rows="";
    for(const sec of SECTIONS){
      rows+='<tr class="sec-band"><td colspan="3">'+sec.name+'</td></tr>';
      for(const size of sec.sizes){
        const c=(snap.counts[sec.key]||{})[size]||{ready:0,repair:0};
        rows+="<tr><td>"+size+"</td>"+FIELDS.map(f=>"<td>"+c[f]+"</td>").join("")+"</tr>";
      }
    }
    const scrapTxt = (snap.scrap&&snap.scrap.length)
      ? snap.scrap.map(it=>esc(scrapLabel(it))).join("<br>")
      : "None";
    const card=document.createElement("div");
    card.className="week-card";
    card.innerHTML=
      "<h3><span>Week of "+fmtDate(snap.date)+
      '<span class="sent-badge'+(snap.sent?"":" no")+'">'+(snap.sent?"Sent":"Not sent")+"</span></span>"+
      '<button class="del" data-del="'+i+'">Delete</button></h3>'+
      '<table><tr><th>Size</th><th>Ready</th><th>Repair</th></tr>'+rows+"</table>"+
      '<div style="margin-top:8px;font-size:13px"><b>Scrap:</b> '+scrapTxt+'</div>';
    hv.appendChild(card);
  }
}
document.getElementById("historyView").addEventListener("click",(e)=>{
  const del=e.target.closest("[data-del]");
  if(!del) return;
  if(confirm("Delete this saved week? This can't be undone.")){
    state.history.splice(+del.dataset.del,1); persist(); buildHistory(); toast("Week deleted");
  }
});

// ---------------- Report building ----------------
function repairNotes(){
  const out=[];
  for(const sec of SECTIONS) for(const size of sec.sizes){
    const c=state.counts[sec.key][size];
    const note=(state.notes[sec.key+"|"+size]||"").trim();
    if(note && (c.repair>0)) out.push(sec.short+" "+size+" ("+c.repair+" in repair): "+note);
    else if(note) out.push(sec.short+" "+size+": "+note);
  }
  return out;
}
function reportText(){
  const L=[];
  L.push("WEEKLY CONTAINER INVENTORY \u2014 "+SITE);
  L.push("Date: "+fmtDate(state.date)+"   Completed by: "+(state.name||"(unsigned)"));
  L.push("");
  L.push("--- SCRAP ---");
  if(state.scrap.length) state.scrap.forEach(it=>L.push("  "+scrapLabel(it)));
  else L.push("  None this week.");
  const rn=repairNotes();
  if(rn.length){ L.push(""); L.push("--- REPAIR / NOTES ---"); rn.forEach(n=>L.push("  "+n)); }
  for(const sec of SECTIONS){
    L.push(""); L.push("--- "+sec.name.toUpperCase()+" ---");
    for(const size of sec.sizes){
      const c=state.counts[sec.key][size];
      L.push("  "+size.padEnd(8)+" Ready "+c.ready+"   Repair "+c.repair);
    }
  }
  L.push(""); L.push("Sent from WM Weekly Inventory");
  return L.join("\n");
}

// ---------------- Send ----------------
const sendSheet=document.getElementById("sendSheet");
document.getElementById("sendBtn").addEventListener("click",()=>{
  if(totalCounted()===0){ toast("Nothing counted yet \u2014 nothing to send"); return; }
  if(!(state.name||"").trim()){
    toast("Enter your name up top first");
    nameInput.focus();
    window.scrollTo({top:0,behavior:"smooth"});
    return;
  }
  sendSheet.classList.add("open");
});
document.getElementById("optCancel").addEventListener("click",()=>sendSheet.classList.remove("open"));
sendSheet.addEventListener("click",e=>{ if(e.target===sendSheet) sendSheet.classList.remove("open"); });

document.getElementById("optEmail").addEventListener("click",()=>{
  sendSheet.classList.remove("open");
  const subject="Weekly Container Inventory \u2014 "+SITE+" \u2014 "+fmtDate(state.date)+" \u2014 "+(state.name||"").trim();
  const url="mailto:"+RECIPIENTS+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(reportText());
  playSendAnimation(()=>{
    saveSnapshot(true);
    state.pendingReset=true; persist();
    window.location.href=url;
  });
});
document.getElementById("optPdf").addEventListener("click",()=>{
  sendSheet.classList.remove("open");
  buildPrintReport();
  setTimeout(()=>window.print(),150);
});
document.getElementById("optCsv").addEventListener("click",()=>{
  sendSheet.classList.remove("open");
  let csv="Section,Size,Ready,Repair,Notes\n";
  for(const sec of SECTIONS) for(const size of sec.sizes){
    const c=state.counts[sec.key][size];
    const note=(state.notes[sec.key+"|"+size]||"").replace(/"/g,'""');
    csv+='"'+sec.name+'","'+size+'",'+c.ready+","+c.repair+',"'+note+'"\n';
  }
  csv+="\nScrap\nQuantity,Type,Size\n";
  state.scrap.forEach(it=>{ csv+=it.qty+',"'+SECTIONS.find(s=>s.key===it.type).short+'","'+it.size+'"\n'; });
  const blob=new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="WM_Inventory_"+(state.date||todayISO())+".csv";
  a.click(); URL.revokeObjectURL(a.href);
  toast("CSV downloaded");
});

// ---------------- Send animation ----------------
function playSendAnimation(done){
  const overlay=document.getElementById("sendAnim");
  const truck=document.getElementById("truck");
  const canTilt=document.getElementById("canTilt");
  const badge=document.getElementById("checkBadge");
  const checkPath=document.getElementById("checkPath");
  const cap=document.getElementById("animCaption");
  const wheels=[document.getElementById("wheelRear"),document.getElementById("wheelFront")];

  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  overlay.classList.add("open");

  // reset
  truck.setAttribute("transform","translate(560,0)");
  canTilt.setAttribute("transform","rotate(0 4 176)");
  badge.setAttribute("opacity","0");
  checkPath.style.strokeDashoffset="60";
  cap.classList.remove("show");
  cap.textContent="Loading up";

  if(reduce){
    badge.setAttribute("opacity","1");
    checkPath.style.transition="none";
    checkPath.style.strokeDashoffset="0";
    cap.textContent="Report Ready";
    cap.classList.add("show");
    setTimeout(()=>{overlay.classList.remove("open");done();},900);
    return;
  }

  const t0=performance.now();
  const BACK_MS=850, TILT_MS=550, HOLD_MS=180, DRIVE_MS=680;
  const START_X=560, DOCK_X=196, END_X=-260;
  let phase=0;
  let wheelAngle=0;

  function spinWheels(dx){
    wheelAngle += dx*2.2;
    wheels.forEach(w=>{
      const cx = w===wheels[0]?42:126;
      w.setAttribute("transform","rotate("+wheelAngle+" "+cx+" 160)");
    });
  }
  const easeOut=t=>1-Math.pow(1-t,3);
  const easeIn=t=>t*t;

  let lastX=START_X;
  function frame(now){
    const t=now-t0;
    if(t<BACK_MS){            // back up to the can
      const p=easeOut(t/BACK_MS);
      const x=START_X+(DOCK_X-START_X)*p;
      truck.setAttribute("transform","translate("+x+",0)");
      spinWheels(x-lastX); lastX=x;
    } else if(t<BACK_MS+TILT_MS){   // forks lift, can tilts forward 45deg
      if(phase<1){ phase=1; cap.textContent="Loading up"; cap.classList.add("show"); }
      const p=easeOut((t-BACK_MS)/TILT_MS);
      canTilt.setAttribute("transform","rotate("+(-45*p)+" 4 176)");
      truck.setAttribute("transform","translate("+DOCK_X+",0)");
    } else if(t<BACK_MS+TILT_MS+HOLD_MS){
      canTilt.setAttribute("transform","rotate(-45 4 176)");
    } else if(t<BACK_MS+TILT_MS+HOLD_MS+DRIVE_MS){  // drive off left, can rides along
      if(phase<2){ phase=2; cap.textContent="Hauling out"; }
      const p=easeIn((t-BACK_MS-TILT_MS-HOLD_MS)/DRIVE_MS);
      const x=DOCK_X+(END_X-DOCK_X)*p;
      truck.setAttribute("transform","translate("+x+",0)");
      document.getElementById("can").setAttribute("transform","translate("+(96+(x-DOCK_X))+",0)");
      spinWheels(x-lastX); lastX=x;
    } else {
      // finish: check badge
      badge.setAttribute("opacity","1");
      checkPath.style.transition="stroke-dashoffset .45s ease-out";
      checkPath.style.strokeDashoffset="0";
      cap.textContent="Report Ready";
      cap.classList.add("show");
      setTimeout(()=>{
        overlay.classList.remove("open");
        document.getElementById("can").setAttribute("transform","translate(96,0)");
        canTilt.setAttribute("transform","rotate(0 4 176)");
        done();
      },620);
      return;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// ---------------- Print report ----------------
function buildPrintReport(){
  const pr=document.getElementById("printReport");
  let html="<h1>Weekly Container Inventory</h1>"+
    '<div class="pr-meta"><b>Site:</b> '+SITE+' &nbsp;&nbsp; <b>Date:</b> '+fmtDate(state.date)+
    ' &nbsp;&nbsp; <b>Completed by:</b> '+esc(state.name||"____________")+"</div>";

  html+='<div class="callout"><b>Scrap</b>';
  if(state.scrap.length){
    html+="<ul>"+state.scrap.map(it=>"<li>"+esc(scrapLabel(it))+"</li>").join("")+"</ul>";
  } else html+="None this week.";
  html+="</div>";

  const rn=repairNotes();
  if(rn.length){
    html+='<div class="callout"><b>Repair / Notes</b><ul>'+rn.map(n=>"<li>"+esc(n)+"</li>").join("")+"</ul></div>";
  }

  for(const sec of SECTIONS){
    html+="<h2>"+sec.name+"</h2><table><tr><th>Size</th><th>Ready</th><th>Repair</th></tr>";
    for(const size of sec.sizes){
      const c=state.counts[sec.key][size];
      html+="<tr><td>"+size+"</td><td>"+c.ready+"</td><td>"+c.repair+"</td></tr>";
    }
    html+="</table>";
  }
  pr.innerHTML=html;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// ---------------- Toast ----------------
let toastTimer;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),1900);
}

// ---------------- Sticky header offset ----------------
// Section headers pin directly below the Tally/History nav bar.
function syncNavHeight(){
  const nav=document.querySelector("nav");
  if(nav) document.documentElement.style.setProperty("--navH", nav.offsetHeight+"px");
}
syncNavHeight();
window.addEventListener("resize", syncNavHeight);
window.addEventListener("orientationchange", ()=>setTimeout(syncNavHeight,200));

// ---------------- Init ----------------
buildTally();
syncUndoBtn();

// After a report is sent, the mail app takes over the screen. When the user comes back,
// offer to clear the sheet so next week starts clean.
function offerPostSendReset(){
  if(!state.pendingReset) return;
  state.pendingReset=false; persist();
  setTimeout(()=>{
    if(confirm("Report sent.\n\nClear the sheet for next week?\n\n(This week is already saved in History.)")){
      resetSheet();
    } else {
      toast("Sheet kept \u2014 hold Undo to clear it later");
    }
  },700);
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible") offerPostSendReset();
});
window.addEventListener("focus", offerPostSendReset);
if(document.visibilityState==="visible") offerPostSendReset();
window.scrollTo(0,state.scrollY||0);

// ---------------- Offline support ----------------
// Caches the app so it opens with no signal. See sw.js.
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW registration failed",e));
  });
}
